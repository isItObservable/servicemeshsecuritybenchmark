# OpenTelemetry Demo - Complete Gateway API Routing Configuration
# This file contains all HTTPRoute, GRPCRoute, and TCPRoute resources for the OpenTelemetry demo
# Based on the service architecture: https://opentelemetry.io/docs/demo/architecture/


# =============================================================================
# FRONTEND SERVICE OUTBOUND ROUTES
# =============================================================================

# Frontend → Checkout
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: frontend-to-checkout
  namespace: otel-demo
  labels:
    app.kubernetes.io/part-of: opentelemetry-demo
    traffic.pattern: frontend-to-checkout
spec:
  parentRefs:
    - name: frontend
      kind: Service
      group: ""
  rules:
    - matches:
        - method:
            type: Exact
            service: oteldemo.CheckoutService
            method: PlaceOrder
      backendRefs:
        - name: checkout
          port: 8080

      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: x-traffic-source
                value: "frontend"
              - name: x-traffic-destination
                value: "checkout"
              - name: x-user-flow
                value: "place-order"
              - name: x-criticality
                value: "high"
    - matches:
        - method:
            type: RegularExpression
            service: oteldemo.CheckoutService
            method: ".*"
      backendRefs:
        - name: checkout
          port: 8080

---
# Frontend → Cart
apiVersion: gateway.networking.k8s.io/v1
