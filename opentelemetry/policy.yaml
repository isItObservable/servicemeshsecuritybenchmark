        - method:
            type: Exact
            service: oteldemo.CartService
            method: GetCart
      backendRefs:
        - name: cart
          port: 8080

      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: x-traffic-source
                value: "frontend"
              - name: x-traffic-destination
                value: "cart"
              - name: x-operation
                value: "get-cart"
              - name: x-performance-critical
                value: "true"
    - matches:
        - method:
