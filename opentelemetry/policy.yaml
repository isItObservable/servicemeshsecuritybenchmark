# Checkout → Payment (with Circuit Breaker)
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: checkout-to-payment
  namespace: otel-demo
  labels:
    app.kubernetes.io/part-of: opentelemetry-demo
    traffic.pattern: checkout-to-payment
  annotations:
    circuit-breaker.policy.gateway.io/enabled: "true"
    circuit-breaker.policy.gateway.io/failure-threshold: "5"
    circuit-breaker.policy.gateway.io/recovery-timeout: "30s"
spec:
  parentRefs:
    - name: checkout
      kind: Service
      group: ""
  rules:
    - matches:
        - method:
            type: Exact
            service: oteldemo.PaymentService
            method: Charge
      backendRefs:
        - name: payment
          port: 8080

      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: x-traffic-source
                value: "checkout"
              - name: x-traffic-destination
                value: "payment"
              - name: x-financial-transaction
                value: "true"
              - name: x-audit-required
                value: "true"
              - name: x-retry-sensitive
                value: "true"
              - name: x-circuit-breaker
                value: "enabled"

