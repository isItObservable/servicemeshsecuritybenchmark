  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: otel-demo
  - group: gateway.networking.k8s.io
    kind: GRPCRoute
    namespace: otel-demo
  - group: gateway.networking.k8s.io
    kind: TCPRoute
    namespace: otel-demo
  to:
  - group: ""
    kind: Service
    name: otel-collector

