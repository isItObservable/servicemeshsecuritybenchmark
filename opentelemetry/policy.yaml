# =============================================================================
# OTEL COLLECTOR COMMUNICATION ROUTES
# =============================================================================

# Services → OpenTelemetry Collector (GRPC - Port 4317)
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: services-to-otel-collector-grpc
  namespace: otel-demo
  labels:
    app.kubernetes.io/part-of: opentelemetry-demo
    traffic.pattern: services-to-collector
spec:
  parentRefs:
  - name: frontend
    kind: Service
    group: ""
  - name: checkout
    kind: Service
    group: ""
  - name: cart
    kind: Service
    group: ""
  - name: payment
    kind: Service
    group: ""
  - name: product-catalog
    kind: Service
    group: ""
  - name: recommendation
    kind: Service
    group: ""
  - name: ad
    kind: Service
    group: ""
  - name: currency
    kind: Service
    group: ""
  - name: shipping
    kind: Service
    group: ""
  - name: accounting
    kind: Service
    group: ""
  - name: fraud-detection
    kind: Service
    group: ""
  rules:
  - matches:
    - method:
        type: RegularExpression
        service: opentelemetry.proto.collector.trace.v1.TraceService
        method: "Export"
    - method:
        type: RegularExpression
        service: opentelemetry.proto.collector.metrics.v1.MetricsService
        method: "Export"
    - method:
        type: RegularExpression
        service: opentelemetry.proto.collector.logs.v1.LogsService
        method: "Export"
    backendRefs:
      - name: otel-collector
        namespace: default
        port: 4317

    filters:
      - type: RequestHeaderModifier
        requestHeaderModifier:
          add:
            - name: x-traffic-destination
              value: "otel-collector"
            - name: x-telemetry-export
              value: "true"
            - name: x-protocol
              value: "grpc"

