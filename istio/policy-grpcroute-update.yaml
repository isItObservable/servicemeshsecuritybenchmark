# ============================================
# HTTPRoute: productpage -> reviews
# Using Service as parentRef (GAMMA pattern)
# ============================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: productpage-to-reviews
  namespace: booking
spec:
  # ParentRef is the consumer service (productpage)
  parentRefs:
    - group: ""
      kind: Service
      name: productpage
      port: 9080
  # Traffic destined for reviews
  hostnames:
    - reviews.booking.svc.cluster.local
    - reviews
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Native timeout in HTTPRoute
      timeouts:
        request: 2s
        backendRequest: 1500ms
      # ExtensionRef for circuit breaker policy
      filters:
        - type: ExtensionRef
          extensionRef:
            group: networking.istio.io
            kind: DestinationRule
            name: reviews-policies
        - type: ExtensionRef
          extensionRef:
            group: networking.istio.io
            kind: EnvoyFilter
            name: reviews-ratelimit
      backendRefs:
        - name: reviews
          port: 9080
---
# ============================================
# HTTPRoute: productpage -> details
# Using Service as parentRef (GAMMA pattern)
# ============================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: productpage-to-details
  namespace: booking
spec:
  # ParentRef is the consumer service (productpage)
  parentRefs:
    - group: ""
      kind: Service
      name: productpage
      port: 9080
  # Traffic destined for details
  hostnames:
    - details.default.svc.cluster.local
    - details
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Native timeout in HTTPRoute
      timeouts:
        request: 1s
        backendRequest: 800ms
      # ExtensionRef for circuit breaker policy
      filters:
        - type: ExtensionRef
          extensionRef:
            group: networking.istio.io
            kind: DestinationRule
            name: details-policies
        - type: ExtensionRef
          extensionRef:
            group: networking.istio.io
            kind: EnvoyFilter
            name: details-ratelimit
      backendRefs:
        - name: details
          port: 9080
---