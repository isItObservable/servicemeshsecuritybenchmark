
# ============================================
# DestinationRule: Circuit Breaker for reviews
# Works with Ambient/Waypoint
# ============================================
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: reviews-circuit-breaker
  namespace: booking
spec:
  host: reviews.booking.svc.cluster.local
  trafficPolicy:
    # Connection pool settings (rate limiting at connection level)
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 10
        http2MaxRequests: 100
        maxRequestsPerConnection: 2
        maxRetries: 3
    # Circuit breaker via outlier detection
    outlierDetection:
      consecutive5xxErrors: 5
      consecutiveGatewayErrors: 3
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 50
      splitExternalLocalOriginErrors: true
    # Load balancer
    loadBalancer:
      simple: LEAST_REQUEST
      localityLbSetting:
        enabled: true
---
# ============================================
# DestinationRule: Circuit Breaker for details
# ============================================
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: details-circuit-breaker
  namespace: booking
spec:
  host: details.booking.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 50
      http:
        http1MaxPendingRequests: 10
        http2MaxRequests: 50
        maxRequestsPerConnection: 2
        maxRetries: 3
    outlierDetection:
      consecutive5xxErrors: 5
      consecutiveGatewayErrors: 3
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 50
    loadBalancer:
      simple: LEAST_REQUEST
---
# ============================================
# VirtualService: Timeout and Retry (alternative to HTTPRoute)
# Can be used alongside HTTPRoute in Ambient
# ============================================
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: reviews-vs
  namespace: booking
spec:
  hosts:
    - reviews.booking.svc.cluster.local
  http:
    - timeout: 2s
      retries:
        attempts: 3
        perTryTimeout: 500ms
        retryOn: 5xx,reset,connect-failure,refused-stream
      route:
        - destination:
            host: reviews.booking.svc.cluster.local
            port:
              number: 9080
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: details-vs
  namespace: booking
spec:
  hosts:
    - details.booking.svc.cluster.local
  http:
    - timeout: 1s
      retries:
        attempts: 3
        perTryTimeout: 300ms
        retryOn: 5xx,reset,connect-failure,refused-stream
      route:
        - destination:
            host: details.booking.svc.cluster.local
            port:
              number: 9080