
# ============================================
# HTTPRoute: productpage -> reviews
# Using Service as parentRef (GAMMA pattern)
# ============================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: productpage-to-reviews
  namespace: booking
spec:
  # ParentRef is the consumer service (productpage)
  parentRefs:
    - group: "gateway.networking.k8s.io"
      kind: Gateway
      name: bookinfo-waypoint
  # Traffic destined for reviews
  hostnames:
    - reviews.booking.svc.cluster.local
    - reviews
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Native timeout in HTTPRoute
      timeouts:
        request: 2s
        backendRequest: 1500ms
      # Retry configuration (native Gateway API)
      retry:
        codes:
          - 500
          - 502
          - 503
        attempts: 3
      # ExtensionRef to Istio policies (attached via waypoint)
      filters:
        - type: ExtensionRef
          extensionRef:
            group: networking.istio.io
            kind: DestinationRule
            name: reviews-circuit-breaker
      backendRefs:
        - name: reviews
          port: 9080
---
# ============================================
# HTTPRoute: productpage -> details
# Using Service as parentRef (GAMMA pattern)
# ============================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: productpage-to-details
  namespace: booking
spec:
  # ParentRef is the consumer service (productpage)
  parentRefs:
    - group: "gateway.networking.k8s.io"
      kind: Gateway
      name: bookinfo-waypoint
  # Traffic destined for details
  hostnames:
    - details.booking.svc.cluster.local
    - details
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Native timeout
      timeouts:
        request: 1s
        backendRequest: 800ms
      # Retry configuration
      retry:
        codes:
          - 500
          - 502
          - 503
        attempts: 3
      # ExtensionRef to Istio policies
      filters:
        - type: ExtensionRef
          extensionRef:
            group: networking.istio.io
            kind: DestinationRule
            name: details-circuit-breaker
      backendRefs:
        - name: details
          port: 9080