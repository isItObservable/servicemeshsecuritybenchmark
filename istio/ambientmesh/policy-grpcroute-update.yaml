# File: grpc-routes-ambient.yaml
# GRPCRoutes with ExtensionRef to Ambient Mesh (Istio) policies

---
# Frontend → Product Catalog
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: frontend-to-product-catalog
  namespace: otel-demo
  labels:
    app.kubernetes.io/part-of: opentelemetry-demo
    traffic.pattern: frontend-to-product-catalog
    istio.io/use-waypoint: otel-demo-waypoint
spec:
  parentRefs:
    - name: otel-demo-waypoint
      namespace: otel-demo
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - method:
            type: Exact
            service: oteldemo.ProductCatalogService
            method: ListProducts
      backendRefs:
        - name: product-catalog
          port: 8080
      filters:
        - type: ExtensionRef
          extensionRef:
            group: networking.istio.io
            kind: DestinationRule
            name: product-catalog-circuit-breaker
        - type: ExtensionRef
          extensionRef:
            group: networking.istio.io
            kind: VirtualService
            name: frontend-to-product-catalog-vs
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: x-traffic-source
                value: "frontend"
              - name: x-traffic-destination
                value: "product-catalog"
              - name: x-catalog-context
                value: "product-listing"
              - name: x-method-type
                value: "ListProducts"

    - matches:
        - method:
            type: Exact
            service: oteldemo.ProductCatalogService
            method: GetProduct
      backendRefs:
        - name: product-catalog
          port: 8080
      filters:
        - type: ExtensionRef
          extensionRef:
            group: networking.istio.io
            kind: DestinationRule
            name: product-catalog-circuit-breaker
        - type: ExtensionRef
          extensionRef:
            group: networking.istio.io
            kind: VirtualService
            name: frontend-to-product-catalog-vs
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: x-traffic-source
                value: "frontend"
              - name: x-traffic-destination
                value: "product-catalog"
              - name: x-catalog-context
                value: "product-detail"
              - name: x-method-type
                value: "GetProduct"

    - matches:
        - method:
            type: Exact
            service: oteldemo.ProductCatalogService
            method: SearchProducts
      backendRefs:
        - name: product-catalog
          port: 8080
      filters:
        - type: ExtensionRef
          extensionRef:
            group: networking.istio.io
            kind: DestinationRule
            name: product-catalog-circuit-breaker
        - type: ExtensionRef
          extensionRef:
            group: networking.istio.io
            kind: VirtualService
            name: frontend-to-product-catalog-vs
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: x-traffic-source
                value: "frontend"
              - name: x-traffic-destination
                value: "product-catalog"
              - name: x-catalog-context
                value: "product-search"
              - name: x-method-type
                value: "SearchProducts"

---
# Frontend → Checkout Service
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: frontend-to-checkout
  namespace: otel-demo
  labels:
    app.kubernetes.io/part-of: opentelemetry-demo
    traffic.pattern: frontend-to-checkout
    istio.io/use-waypoint: otel-demo-waypoint
spec:
  parentRefs:
    - name: otel-demo-waypoint
      namespace: otel-demo
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - method:
            type: Exact
            service: oteldemo.CheckoutService
            method: PlaceOrder
      backendRefs:
        - name: checkout
          port: 8080
      filters:
        - type: ExtensionRef
          extensionRef:
            group: networking.istio.io
            kind: DestinationRule
            name: checkout-circuit-breaker
        - type: ExtensionRef
          extensionRef:
            group: networking.istio.io
            kind: VirtualService
            name: frontend-to-checkout-vs
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: x-traffic-source
                value: "frontend"
              - name: x-traffic-destination
                value: "checkout"
              - name: x-method-type
                value: "PlaceOrder"