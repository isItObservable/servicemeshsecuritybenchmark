

# DestinationRule for Product Catalog - Circuit Breaker
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: product-catalog-circuit-breaker
  namespace: otel-demo
  labels:
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  host: product-catalog.otel-demo.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
        maxRequestsPerConnection: 2
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 50
    loadBalancer:
      simple: LEAST_REQUEST

---
# DestinationRule for Checkout Service - Circuit Breaker
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: checkout-circuit-breaker
  namespace: otel-demo
  labels:
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  host: checkout.otel-demo.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 50
      http:
        http1MaxPendingRequests: 25
        http2MaxRequests: 50
        maxRequestsPerConnection: 2
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 20s
      baseEjectionTime: 60s
      maxEjectionPercent: 50
      minHealthPercent: 50
    loadBalancer:
      simple: LEAST_REQUEST

---
# VirtualService for Frontend to Product Catalog - Timeout & Retry
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: frontend-to-product-catalog-vs
  namespace: otel-demo
  labels:
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  hosts:
    - product-catalog.otel-demo.svc.cluster.local
  http:
    - match:
        - sourceLabels:
            app: frontend
      route:
        - destination:
            host: product-catalog.otel-demo.svc.cluster.local
            port:
              number: 8080
      timeout: 5s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,reset,connect-failure,refused-stream

---
# VirtualService for Frontend to Checkout - Timeout & Retry
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: frontend-to-checkout-vs
  namespace: otel-demo
  labels:
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  hosts:
    - checkout.otel-demo.svc.cluster.local
  http:
    - match:
        - sourceLabels:
            app: frontend
      route:
        - destination:
            host: checkout.otel-demo.svc.cluster.local
            port:
              number: 8080
      timeout: 10s
      retries:
        attempts: 2
        perTryTimeout: 5s
        retryOn: 5xx,reset,connect-failure,refused-stream

---
# EnvoyFilter for Rate Limiting - Product Catalog
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: product-catalog-ratelimit
  namespace: otel-demo
  labels:
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  workloadSelector:
    labels:
      app: product-catalog
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_INBOUND
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.local_ratelimit
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
            stat_prefix: http_local_rate_limiter
            token_bucket:
              max_tokens: 100
              tokens_per_fill: 100
              fill_interval: 60s
            filter_enabled:
              runtime_key: local_rate_limit_enabled
              default_value:
                numerator: 100
                denominator: HUNDRED
            filter_enforced:
              runtime_key: local_rate_limit_enforced
              default_value:
                numerator: 100
                denominator: HUNDRED
            response_headers_to_add:
              - append: false
                header:
                  key: x-local-rate-limit
                  value: 'true'

