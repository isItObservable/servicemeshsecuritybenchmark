# ============================================
# EnvoyFilter: Rate Limiting for reviews
# Referenced by HTTPRoute extensionRef
# ============================================
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: reviews-ratelimit
  namespace: booking
spec:
  # Apply to productpage workload (outbound traffic)
  workloadSelector:
    labels:
      app: productpage
  configPatches:
    # Insert local rate limit filter
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_OUTBOUND
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.local_ratelimit
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
            stat_prefix: http_local_rate_limiter_reviews
            token_bucket:
              # 100 requests per minute
              max_tokens: 100
              tokens_per_fill: 100
              fill_interval: 60s
            filter_enabled:
              runtime_key: local_rate_limit_enabled
              default_value:
                numerator: 100
                denominator: HUNDRED
            filter_enforced:
              runtime_key: local_rate_limit_enforced
              default_value:
                numerator: 100
                denominator: HUNDRED
            response_headers_to_add:
              - append: false
                header:
                  key: x-local-rate-limit
                  value: 'true'
            # Apply only to reviews traffic
            descriptors:
              - entries:
                  - key: destination_cluster
                    value: outbound|9080||reviews.booking.svc.cluster.local
                token_bucket:
                  max_tokens: 100
                  tokens_per_fill: 100
                  fill_interval: 60s
---
