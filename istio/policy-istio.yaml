
# ============================================
# DestinationRule: Circuit Breaker for reviews
# Referenced by HTTPRoute extensionRef
# ============================================
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: reviews-policies
  namespace: booking
spec:
  host: reviews.booking.svc.cluster.local
  trafficPolicy:
    # Connection pool settings (acts as rate limiting)
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 10
        http2MaxRequests: 100
        maxRequestsPerConnection: 2
        # Additional connection settings
        maxRetries: 3
    # Circuit breaker via outlier detection
    outlierDetection:
      # Trip circuit after 5 consecutive errors
      consecutive5xxErrors: 5
      consecutiveGatewayErrors: 3
      # Check every 30 seconds
      interval: 30s
      # Eject pod for 30 seconds
      baseEjectionTime: 30s
      # Maximum 50% of instances can be ejected
      maxEjectionPercent: 50
      # Minimum 50% must remain healthy
      minHealthPercent: 50
    # Load balancing
    loadBalancer:
      simple: LEAST_REQUEST
      localityLbSetting:
        enabled: true
---
# ============================================
# DestinationRule: Circuit Breaker for details
