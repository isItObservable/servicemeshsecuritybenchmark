---
# ServiceProfile for reviews service with timeout
apiVersion: linkerd.io/v1alpha2
kind: ServiceProfile
metadata:
  name: reviews.booking.svc.cluster.local
  namespace: booking
spec:
  routes:
    - name: GET /reviews
      condition:
        method: GET
        pathRegex: /.*
      timeout: 2s
---
# ServiceProfile for details service with timeout
apiVersion: linkerd.io/v1alpha2
kind: ServiceProfile
metadata:
  name: details.booking.svc.cluster.local
  namespace: booking
spec:
  routes:
    - name: GET /details
      condition:
        method: GET
        pathRegex: /.*
      timeout: 1s
---
# HTTPLocalRateLimitPolicy for reviews
apiVersion: policy.linkerd.io/v1alpha1
kind: HTTPLocalRateLimitPolicy
metadata:
  name: reviews-rate-limit
  namespace: booking
spec:
  targetRef:
    group: core
    kind: Service
    name: reviews
  total:
    requestsPerSecond: 100
---
# HTTPLocalRateLimitPolicy for details
apiVersion: policy.linkerd.io/v1alpha1
kind: HTTPLocalRateLimitPolicy
metadata:
  name: details-rate-limit
  namespace: booking
spec:
  targetRef:
    group: core
    kind: Service
    name: details
  total:
    requestsPerSecond: 50
---
# Server resource for reviews to enable advanced policies
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: reviews-server
  namespace: booking
spec:
  podSelector:
    matchLabels:
      app: reviews
  port: http
  proxyProtocol: HTTP/1
---
# Server resource for details
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: details-server
  namespace: booking
spec:
  podSelector:
    matchLabels:
      app: details
  port: http
  proxyProtocol: HTTP/1
---
# Authorization policy - allow productpage to access reviews
apiVersion: policy.linkerd.io/v1beta1
kind: ServerAuthorization
metadata:
  name: reviews-allow-productpage
  namespace: booking
spec:
  server:
    name: reviews-server
  client:
    meshTLS:
      serviceAccounts:
        - name: bookinfo-productpage
          namespace: booking
---
# Authorization policy - allow productpage to access details
apiVersion: policy.linkerd.io/v1beta1
kind: ServerAuthorization
metadata:
  name: details-allow-productpage
  namespace: booking
spec:
  server:
    name: details-server
  client:
    meshTLS:
      serviceAccounts:
        - name: bookinfo-productpage
          namespace: booking
---
# Authorization policy - allow reviews to access ratings
apiVersion: policy.linkerd.io/v1beta1
kind: ServerAuthorization
metadata:
  name: ratings-allow-reviews
  namespace: booking
spec:
  server:
    selector:
      matchLabels:
        app: ratings
  client:
    meshTLS:
      serviceAccounts:
        - name: bookinfo-reviews
          namespace: booking