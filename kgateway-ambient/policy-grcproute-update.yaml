# ============================================
# ============================================
# HTTPRoute: waypoint -> reviews with extensionRef
# ParentRef is the waypoint (Ambient pattern)
# ============================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reviews-route
  namespace: default
spec:
  # ParentRef is the waypoint Gateway (Ambient!)
  parentRefs:
    - group: "gateway.networking.k8s.io"
      kind: Gateway
      name: kgateway-waypoint
  # Match traffic to reviews
  hostnames:
    - reviews.booking.svc.cluster.local
    - reviews
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Native timeout (Gateway API)
      timeouts:
        request: 2s
        backendRequest: 1500ms
      # ExtensionRef to policies
      filters:
        # Reference to KGateway TrafficPolicy
        - type: ExtensionRef
          extensionRef:
            group: gateway.solo.io
            kind: TrafficPolicy
            name: reviews-traffic-policy
        # Reference to Istio VirtualService
        - type: ExtensionRef
          extensionRef:
            group: networking.istio.io
            kind: VirtualService
            name: reviews-vs
        # Reference to Istio DestinationRule
        - type: ExtensionRef
          extensionRef:
            group: networking.istio.io
            kind: DestinationRule
            name: reviews-circuit-breaker
      backendRefs:
        - name: reviews
          port: 9080
          weight: 100
---
