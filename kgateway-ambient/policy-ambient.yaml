# File: ambient-policies.yaml
# Deploy Ambient Mesh (Istio) policies for rate limiting, circuit breaker, retries, and timeouts
# Note: Ambient mesh uses waypoint proxies instead of sidecars

---
# DestinationRule for Product Catalog - Circuit Breaker
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: product-catalog-circuit-breaker
  namespace: otel-demo
  labels:
    app.kubernetes.io/part-of: opentelemetry-demo
    policy-type: circuit-breaker
spec:
  host: product-catalog.otel-demo.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 1000
      http:
        http1MaxPendingRequests: 1000
        http2MaxRequests: 1000
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 60s
      baseEjectionTime: 30s
      maxEjectionPercent: 10
      minHealthPercent: 50
    loadBalancer:
      simple: LEAST_REQUEST

