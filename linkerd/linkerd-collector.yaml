apiVersion: v1
data:
  collector-config: |
    exporters:
      jaeger:
        endpoint: jaeger.${POD_NAMESPACE}:14250
        tls:
          insecure: true
      otlphttp:
        endpoint: ${DT_ENDPOINT}/api/v2/otlp
        headers:
          Authorization: "Api-Token ${DT_API_TOKEN}"
    
    extensions:
      health_check: null
    
    processors:

    
      batch:
        send_batch_max_size: 1000
        timeout: 30s
        send_batch_size : 800
    
      k8sattributes:
        auth_type: serviceAccount
        extract:
          labels:
          - from: pod
            key: app.kubernetes.io/name
            tag_name: kube_app_name
          - from: pod
            key: app.kubernetes.io/instance
            tag_name: kube_app_instance
          - from: pod
            key: app.kubernetes.io/version
            tag_name: kube_app_version
          - from: pod
            key: app.kubernetes.io/component
            tag_name: kube_app_component
          - from: pod
            key: app.kubernetes.io/part-of
            tag_name: kube_app_part_of
          - from: pod
            key: app.kubernetes.io/managed-by
            tag_name: kube_app_managed_by
          metadata:
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.deployment.name
          - k8s.node.name
          - k8s.namespace.name
          - k8s.pod.start_time
          - k8s.replicaset.name
          - k8s.replicaset.uid
          - k8s.daemonset.name
          - k8s.daemonset.uid
          - k8s.job.name
          - k8s.job.uid
          - k8s.cronjob.name
          - k8s.statefulset.name
          - k8s.statefulset.uid
          - container.image.name
          - container.image.tag
          - container.id
          - k8s.container.name
          - container.image.name
          - container.image.tag
          - container.id
        pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.name
          - from: resource_attribute
            name: k8s.namespace.name
      resource:
        attributes:
        - action: insert
          from_attribute: host.name
          key: k8s.pod.name
        - action: insert
          from_attribute: linkerd.io/workload-ns
          key: k8s.namespace.name
        - key: k8s.cluster.name 
          value: ${CLUSTERNAME}
          action: insert
    receivers:
      opencensus: null
      otlp:
        protocols:
          grpc: null
    service:
      extensions:
      - health_check
      pipelines:
        traces:
          exporters:
          - jaeger
          - otlphttp
          processors:
          - resource
          - k8sattributes
          - batch
          receivers:
          - opencensus
          - otlp
kind: ConfigMap
metadata:
  labels:
    component: collector
    linkerd.io/extension: jaeger
  name: collector-config
  namespace: linkerd-jaeger

