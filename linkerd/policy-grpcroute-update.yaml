---
# HTTPRoute with productpage as parentRef
# Controls outbound traffic FROM productpage TO reviews
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: productpage-to-reviews
  namespace: booking
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: productpage  # Source service (traffic originates here)
      port: 9080
  hostnames:
    - reviews.booking.svc.cluster.local
    - reviews
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Native timeout in HTTPRoute
      timeouts:
        request: 2s
        backendRequest: 1500ms
      # Retry configuration (native Gateway API)
      retry:
        codes:
          - 500
          - 502
          - 503
        attempts: 3
      # ExtensionRef to Istio policies (attached via waypoint)
      filters:
        - type: ExtensionRef
          extensionRef:
            group: policy.linkerd.io
            kind: HTTPLocalRateLimitPolicy
            name: reviews-rate-limit
        - type: ExtensionRef
          extensionRef:
            group: policy.linkerd.io
            kind: ServiceProfile
            name: reviews-profile

      backendRefs:
        - name: reviews  # Destination service
          port: 9080
---
# HTTPRoute with productpage as parentRef
# Controls outbound traffic FROM productpage TO details
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: productpage-to-details
  namespace: booking
spec:
  hostnames:
    - details.booking.svc.cluster.local
    - details
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Native timeout
      timeouts:
        request: 1s
        backendRequest: 800ms
      # Retry configuration
      retry:
        codes:
          - 500
          - 502
          - 503
        attempts: 3
      # ExtensionRef to Istio policies
      filters:
        - type: ExtensionRef
          extensionRef:
            group: policy.linkerd.io
            kind: HTTPLocalRateLimitPolicy
            name: details-rate-limit
        - type: ExtensionRef
          extensionRef:
            group: policy.linkerd.io
            kind: ServiceProfile
            name: details-profile
      backendRefs:
        - name: details  # Destination service
          port: 9080