apiVersion: policy.linkerd.io/v1beta2
kind: HTTPRoute
metadata:
  name: productpage-to-reviews
  namespace: booking
spec:
  # ParentRef is the consumer service (productpage)
  parentRefs:
    - group: core
      kind: Service
      name: productpage
      port: 9080
  # Rules for routing to reviews
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Native timeout
      timeouts:
        request: 2s
        backendRequest: 1500ms
      # ExtensionRef to Linkerd policies
      filters:
        # Reference to Server (defines the target)
        - type: ExtensionRef
          extensionRef:
            group: policy.linkerd.io
            kind: Server
            name: reviews-server
        # Reference to ServiceProfile (circuit breaker & timeout)
        - type: ExtensionRef
          extensionRef:
            group: linkerd.io
            kind: ServiceProfile
            name: reviews-profile
        # Reference to Rate Limit Policy
        - type: ExtensionRef
          extensionRef:
            group: policy.linkerd.io
            kind: HTTPLocalRateLimitPolicy
            name: reviews-ratelimit
      backendRefs:
        - group: core
          kind: Service
          name: reviews
          port: 9080
---
# ============================================
# HTTPRoute: productpage -> details
# Using Service as parentRef (GAMMA pattern)
# With extensionRef to Server and ServiceProfile
# ============================================
apiVersion: policy.linkerd.io/v1beta2
kind: HTTPRoute
metadata:
  name: productpage-to-details
  namespace: booking
spec:
  # ParentRef is the consumer service (productpage)
  parentRefs:
    - group: core
      kind: Service
      name: productpage
      port: 9080
  # Rules for routing to details
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Native timeout
      timeouts:
        request: 1s
        backendRequest: 800ms
      # ExtensionRef to Linkerd policies
      filters:
        # Reference to Server
        - type: ExtensionRef
          extensionRef:
            group: policy.linkerd.io
            kind: Server
            name: details-server
        # Reference to ServiceProfile
        - type: ExtensionRef
          extensionRef:
            group: linkerd.io
            kind: ServiceProfile
            name: details-profile
        # Reference to Rate Limit Policy
        - type: ExtensionRef
          extensionRef:
            group: policy.linkerd.io
            kind: HTTPLocalRateLimitPolicy
            name: details-ratelimit
      backendRefs:
        - group: core
          kind: Service
          name: details
          port: 9080