apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: fixed-nodeport-params
  namespace: kgateway-system
spec:
  kube:
    service:
      type: NodePort
      ports:
        - name: http
          port: 80
          targetPort: 8080
          nodePort: 30080  # ← Fixed port for HTTP
          protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: bookinfo-gateway
  namespace: booking
  annotations:
    gateway.kgateway.dev/gateway-parameters-name: fixed-nodeport-params
spec:
  gatewayClassName: kgateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
---
# Allow otel-demo namespace routes to reference services in istio-system
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-otel-demo-cross-namespace
  namespace: linkerd
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: booking
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      namespace: booking
    - group: gateway.networking.k8s.io
      kind: TCPRoute
      namespace: booking
  to:
    - group: ""
      kind: Service
---
# Allow otel-demo namespace routes to reference services in istio-system
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-otel-demo-cross-namespace
  namespace: kgateway-system
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: booking
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      namespace: booking
    - group: gateway.networking.k8s.io
      kind: TCPRoute
      namespace: booking
  to:
    - group: ""
      kind: Service