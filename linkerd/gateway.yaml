apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: bookinfo-gateway
  namespace: booking
spec:
  gatewayClassName: kgateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
---
# Allow otel-demo namespace routes to reference services in istio-system
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-otel-demo-cross-namespace
  namespace: linkerd
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: bookinfo
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      namespace: bookinfo
    - group: gateway.networking.k8s.io
      kind: TCPRoute
      namespace: bookinfo
  to:
    - group: ""
      kind: Service
---
# Allow otel-demo namespace routes to reference services in istio-system
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-otel-demo-cross-namespace
  namespace: kgateway-system
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: bookinfo
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      namespace: bookinfo
    - group: gateway.networking.k8s.io
      kind: TCPRoute
      namespace: bookinfo
  to:
    - group: ""
      kind: Service