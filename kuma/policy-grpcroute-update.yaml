apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: productpage-to-reviews
  namespace: booking
  labels:
    kuma.io/mesh: default
spec:
  # ParentRef is the consumer service (productpage)
  parentRefs:
    - group: ""
      kind: Service
      name: productpage
      port: 9080
  # Traffic destined for reviews
  hostnames:
    - reviews.default.svc.cluster.local
    - reviews
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # ExtensionRef to Kuma policies
      filters:
        - type: ExtensionRef
          extensionRef:
            group: kuma.io
            kind: MeshTimeout
            name: reviews-timeout
        - type: ExtensionRef
          extensionRef:
            group: kuma.io
            kind: MeshCircuitBreaker
            name: reviews-circuit-breaker
        - type: ExtensionRef
          extensionRef:
            group: kuma.io
            kind: MeshRateLimit
            name: reviews-ratelimit
      backendRefs:
        - name: reviews
          port: 9080
---
# ============================================
# Kuma MeshHTTPRoute: productpage -> details
# Using Service as parentRef (GAMMA pattern)
# ============================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: productpage-to-details
  namespace: booking
  labels:
    kuma.io/mesh: default
spec:
  # ParentRef is the consumer service (productpage)
  parentRefs:
    - group: ""
      kind: Service
      name: productpage
      port: 9080
  # Traffic destined for details
  hostnames:
    - details.default.svc.cluster.local
    - details
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # ExtensionRef to Kuma policies
      filters:
        - type: ExtensionRef
          extensionRef:
            group: kuma.io
            kind: MeshTimeout
            name: details-timeout
        - type: ExtensionRef
          extensionRef:
            group: kuma.io
            kind: MeshCircuitBreaker
            name: details-circuit-breaker
        - type: ExtensionRef
          extensionRef:
            group: kuma.io
            kind: MeshRateLimit
            name: details-ratelimit
      backendRefs:
        - name: details
          port: 9080