# File: grpc-routes-kuma.yaml
# GRPCRoutes with ExtensionRef to Kuma policies

---
# Frontend → Product Catalog
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: frontend-to-product-catalog
  namespace: otel-demo
  labels:
    app.kubernetes.io/part-of: opentelemetry-demo
    traffic.pattern: frontend-to-product-catalog
    kuma.io/service: product-catalog
  annotations:
    kuma.io/mesh: default
spec:
  parentRefs:
    - name: frontend
      kind: Service
      group: ""
  rules:
    - matches:
        - method:
            type: Exact
            service: oteldemo.ProductCatalogService
            method: ListProducts
      backendRefs:
        - name: product-catalog
          port: 8080
      filters:

        - type: ExtensionRef
          extensionRef:
            group: kuma.io
            kind: MeshCircuitBreaker
            name: product-catalog-circuit-breaker
        - type: ExtensionRef
          extensionRef:
            group: kuma.io
            kind: MeshRateLimit
            name: product-catalog-rate-limit
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: x-traffic-source
                value: "frontend"
              - name: x-traffic-destination
                value: "product-catalog"
              - name: x-catalog-context
                value: "product-listing"
              - name: x-method-type
                value: "ListProducts"

    - matches:
        - method:
            type: Exact
            service: oteldemo.ProductCatalogService
            method: GetProduct
      backendRefs:
        - name: product-catalog
          port: 8080
      filters:

        - type: ExtensionRef
          extensionRef:
            group: kuma.io
            kind: MeshCircuitBreaker
            name: product-catalog-circuit-breaker
        - type: ExtensionRef
          extensionRef:
            group: kuma.io
            kind: MeshRateLimit
            name: product-catalog-rate-limit
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: x-traffic-source
                value: "frontend"
              - name: x-traffic-destination
                value: "product-catalog"
              - name: x-catalog-context
                value: "product-detail"
              - name: x-method-type
                value: "GetProduct"

    - matches:
        - method:
            type: Exact
            service: oteldemo.ProductCatalogService
            method: SearchProducts
      backendRefs:
        - name: product-catalog
          port: 8080
      filters:
        - type: ExtensionRef
          extensionRef:
            group: kuma.io
            kind: MeshCircuitBreaker
            name: product-catalog-circuit-breaker
        - type: ExtensionRef
          extensionRef:
            group: kuma.io
            kind: MeshRateLimit
            name: product-catalog-rate-limit
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: x-traffic-source
                value: "frontend"
              - name: x-traffic-destination
                value: "product-catalog"
              - name: x-catalog-context
                value: "product-search"
              - name: x-method-type
                value: "SearchProducts"

---
# Frontend → Checkout Service
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: frontend-to-checkout
  namespace: otel-demo
  labels:
    app.kubernetes.io/part-of: opentelemetry-demo
    traffic.pattern: frontend-to-checkout
    kuma.io/service: checkout
  annotations:
    kuma.io/mesh: default
spec:
  parentRefs:
    - name: frontend
      kind: Service
      group: ""
  rules:
    - matches:
        - method:
            type: Exact
            service: oteldemo.CheckoutService
            method: PlaceOrder
      backendRefs:
        - name: checkout
          port: 8080
      filters:
        - type: ExtensionRef
          extensionRef:
            group: kuma.io
            kind: MeshCircuitBreaker
            name: checkout-circuit-breaker
        - type: ExtensionRef
          extensionRef:
            group: kuma.io
            kind: MeshRateLimit
            name: checkout-rate-limit
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: x-traffic-source
                value: "frontend"
              - name: x-traffic-destination
                value: "checkout"
              - name: x-method-type
                value: "PlaceOrder"