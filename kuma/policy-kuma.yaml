---
# ============================================
# MeshTimeout: Request timeout for reviews
# ============================================
apiVersion: kuma.io/v1alpha1
kind: MeshTimeout
metadata:
  name: reviews-timeout
  namespace: kuma-system
  labels:
    kuma.io/mesh: default
spec:
  targetRef:
    kind: MeshService
    name: reviews_booking_svc_9080
  to:
    - targetRef:
        kind: MeshService
        name: reviews_booking_svc_9080
      default:
        connectionTimeout: 5s
        idleTimeout: 3600s
        http:
          requestTimeout: 2s
          streamIdleTimeout: 30s
---
# ============================================
# MeshTimeout: Request timeout for details
# ============================================
apiVersion: kuma.io/v1alpha1
kind: MeshTimeout
metadata:
  name: details-timeout
  namespace: kuma-system
  labels:
    kuma.io/mesh: default
spec:
  targetRef:
    kind: MeshService
    name: details_booking_svc_9080
  to:
    - targetRef:
        kind: MeshService
        name: details_booking_svc_9080
      default:
        connectionTimeout: 5s
        idleTimeout: 3600s
        http:
          requestTimeout: 1s
          streamIdleTimeout: 30s
---
# ============================================
# MeshCircuitBreaker: Circuit breaker for reviews
# ============================================
apiVersion: kuma.io/v1alpha1
kind: MeshCircuitBreaker
metadata:
  name: reviews-circuit-breaker
  namespace: kuma-system
  labels:
    kuma.io/mesh: default
spec:
  targetRef:
    kind: MeshService
    name: reviews_booking_svc_9080
  to:
    - targetRef:
        kind: MeshService
        name: reviews_booking_svc_9080
      default:
        connectionLimits:
          maxConnections: 100
          maxPendingRequests: 10
          maxRequests: 100
          maxRetries: 3
        outlierDetection:
          disabled: false
          interval: 30s
          baseEjectionTime: 30s
          maxEjectionPercent: 50
          splitExternalAndLocalErrors: true
          detectors:
            totalFailures:
              consecutive: 5
            gatewayFailures:
              consecutive: 3
            localOriginFailures:
              consecutive: 5
---
# ============================================
# MeshCircuitBreaker: Circuit breaker for details
# ============================================
apiVersion: kuma.io/v1alpha1
kind: MeshCircuitBreaker
metadata:
  name: details-circuit-breaker
  namespace: kuma-system
  labels:
    kuma.io/mesh: default
spec:
  targetRef:
    kind: MeshService
    name: details_booking_svc_9080
  to:
    - targetRef:
        kind: MeshService
        name: details_booking_svc_9080
      default:
        connectionLimits:
          maxConnections: 50
          maxPendingRequests: 10
          maxRequests: 50
          maxRetries: 3
        outlierDetection:
          disabled: false
          interval: 30s
          baseEjectionTime: 30s
          maxEjectionPercent: 50
          detectors:
            totalFailures:
              consecutive: 5
            gatewayFailures:
              consecutive: 3
---
# ============================================
# MeshRateLimit: Rate limiting for reviews
# ============================================
apiVersion: kuma.io/v1alpha1
kind: MeshRateLimit
metadata:
  name: reviews-ratelimit
  namespace: kuma-system
  labels:
    kuma.io/mesh: default
spec:
  targetRef:
    kind: MeshService
    name: reviews_booking_svc_9080
  from:
    - targetRef:
        kind: Mesh
      default:
        local:
          http:
            requestRate:
              num: 100
              interval: 1m
            onRateLimit:
              status: 429
              headers:
                add:
                  - name: x-kuma-rate-limited
                    value: "true"
---
# ============================================
# MeshRateLimit: Rate limiting for details
# ============================================
apiVersion: kuma.io/v1alpha1
kind: MeshRateLimit
metadata:
  name: details-ratelimit
  namespace: kuma-system
  labels:
    kuma.io/mesh: default
spec:
  targetRef:
    kind: MeshService
    name: details_booking_svc_9080
  from:
    - targetRef:
        kind: Mesh
      default:
        local:
          http:
            requestRate:
              num: 50
              interval: 1m
            onRateLimit:
              status: 429
              headers:
                add:
                  - name: x-kuma-rate-limited
                    value: "true"
---
# ============================================
# MeshRetry: Automatic retries for reviews
# ============================================
apiVersion: kuma.io/v1alpha1
kind: MeshRetry
metadata:
  name: reviews-retry
  namespace: kuma-system
  labels:
    kuma.io/mesh: default
spec:
  targetRef:
    kind: MeshService
    name: reviews_booking_svc_9080
  to:
    - targetRef:
        kind: MeshService
        name: reviews_booking_svc_9080
      default:
        http:
          numRetries: 3
          perTryTimeout: 500ms
          backOff:
            baseInterval: 25ms
            maxInterval: 250ms
          retryOn:
            - "5xx"