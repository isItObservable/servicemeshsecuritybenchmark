# ============================================
# MeshTimeout: Request timeout for reviews
# ============================================
apiVersion: kuma.io/v1alpha1
kind: MeshTimeout
metadata:
  name: reviews-timeout
  namespace: kuma-system
  labels:
    kuma.io/mesh: default
spec:
  # Target the route from productpage to reviews
  targetRef:
    kind: MeshService
    name: reviews_booking_svc_9080
  from:
    - targetRef:
        kind: MeshService
        name: productpage_booking_svc_9080
      default:
        # HTTP request timeout
        http:
          requestTimeout: 2s
          # Idle timeout
          idleTimeout: 15s
          # Stream idle timeout
          streamIdleTimeout: 30s
---
# ============================================
# MeshTimeout: Request timeout for details
# ============================================
apiVersion: kuma.io/v1alpha1
kind: MeshTimeout
metadata:
  name: details-timeout
  namespace: kuma-system
  labels:
    kuma.io/mesh: default
spec:
  # Target the route from productpage to details
  targetRef:
    kind: MeshService
    name: details_booking_svc_9080
  from:
    - targetRef:
        kind: MeshService
        name: productpage_booking_svc_9080
      default:
        http:
          requestTimeout: 1s
          idleTimeout: 15s
          streamIdleTimeout: 30s
---
# ============================================
# MeshCircuitBreaker: Circuit breaker for reviews
# ============================================
apiVersion: kuma.io/v1alpha1
kind: MeshCircuitBreaker
metadata:
  name: reviews-circuit-breaker
  namespace: kuma-system
  labels:
    kuma.io/mesh: default
spec:
  # Target reviews service
  targetRef:
    kind: MeshService
    name: reviews_booking_svc_9080
  # Apply from productpage
  from:
    - targetRef:
        kind: MeshService
        name: productpage_booking_svc_9080
      default:
        # Connection pool settings
        connectionLimits:
          maxConnections: 100
          maxPendingRequests: 10
          maxRequests: 100
          maxRetries: 3
        # Outlier detection (circuit breaker)
        outlierDetection:
          # Number of errors before ejection
          detectors:
            totalErrors:
              consecutive: 5
            gatewayErrors:
              consecutive: 3
            localOriginErrors:
              consecutive: 5
          # Detection interval
          interval: 30s
          # Ejection time
          baseEjectionTime: 30s
          # Maximum percentage of hosts that can be ejected
          maxEjectionPercent: 50
          # Split external and local origin errors
          splitExternalLocalOriginErrors: true
---
# ============================================
# MeshCircuitBreaker: Circuit breaker for details
# ============================================
apiVersion: kuma.io/v1alpha1
kind: MeshCircuitBreaker
metadata:
  name: details-circuit-breaker
  namespace: kuma-system
  labels:
    kuma.io/mesh: default
spec:
  # Target details service
  targetRef:
    kind: MeshService
    name: details_booking_svc_9080
  # Apply from productpage
  from:
    - targetRef:
        kind: MeshService
        name: productpage_booking_svc_9080
      default:
        connectionLimits:
          maxConnections: 50
          maxPendingRequests: 10
          maxRequests: 50
          maxRetries: 3
        outlierDetection:
          detectors:
            totalErrors:
              consecutive: 5
            gatewayErrors:
              consecutive: 3
          interval: 30s
          baseEjectionTime: 30s
          maxEjectionPercent: 50
---
# ============================================
# MeshRateLimit: Rate limiting for reviews
# ============================================
apiVersion: kuma.io/v1alpha1
kind: MeshRateLimit
metadata:
  name: reviews-ratelimit
  namespace: kuma-system
  labels:
    kuma.io/mesh: default
spec:
  # Target reviews service
  targetRef:
    kind: MeshService
    name: reviews_booking_svc_9080
  # Apply from productpage
  from:
    - targetRef:
        kind: MeshService
        name: productpage_booking_svc_9080
      default:
        # Local rate limiting (token bucket)
        local:
          http:
            # 100 requests per minute
            requestRate:
              num: 100
              interval: 1m
            # On rate limit, return 429
            onRateLimit:
              status: 429
              headers:
                add:
                  - name: x-kuma-rate-limited
                    value: "true"
---
# ============================================
# MeshRateLimit: Rate limiting for details
# ============================================
apiVersion: kuma.io/v1alpha1
kind: MeshRateLimit
metadata:
  name: details-ratelimit
  namespace: kuma-system
  labels:
    kuma.io/mesh: default
spec:
  # Target details service
  targetRef:
    kind: MeshService
    name: details_booking_svc_9080
  # Apply from productpage
  from:
    - targetRef:
        kind: MeshService
        name: productpage_booking_svc_9080
      default:
        local:
          http:
            # 50 requests per minute (stricter than reviews)
            requestRate:
              num: 50
              interval: 1m
            onRateLimit:
              status: 429
              headers:
                add:
                  - name: x-kuma-rate-limited
                    value: "true"
---
# ============================================
# Optional: MeshRetry for automatic retries
# ============================================
apiVersion: kuma.io/v1alpha1
kind: MeshRetry
metadata:
  name: reviews-retry
  namespace: kuma-system
  labels:
    kuma.io/mesh: default
spec:
  targetRef:
    kind: MeshService
    name: reviews_booking_svc_9080
  from:
    - targetRef:
        kind: MeshService
        name: productpage_booking_svc_9080
      default:
        http:
          numRetries: 3
          perTryTimeout: 500ms
          backOff:
            baseInterval: 25ms
            maxInterval: 250ms
          retriableStatusCodes:
            - 500
            - 502
            - 503
            - 504
          retriableMethods:
            - GET
            - HEAD
            - OPTIONS